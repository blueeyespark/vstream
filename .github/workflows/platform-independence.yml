name: Platform Independence Verification

permissions:
  contents: write

on:
  push:
    branches: [feature/platform-independence]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify no Base44 runtime code remains
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'base44|@base44|VITE_BASE44|base44\.app' src server package.json vite.config.js .env.example index.html --exclude-dir=node_modules; then
            echo "Legacy Base44 runtime reference detected."
            exit 1
          fi
          test ! -e base44
          test ! -e src/api/base44Client.js
          test ! -e src/lib/app-params.js
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Syntax-check owned server
        working-directory: server
        run: |
          node --check src/index.js
          node --check src/auth.js
          node --check src/db.js
          node --check src/entities.js
          node --check src/functions.js
          node --check src/media.js
          node --check src/session.js
